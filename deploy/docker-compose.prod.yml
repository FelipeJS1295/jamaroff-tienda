# Jamaroff en el VPS de Cuadra: base de datos + tienda. El HTTPS lo pone el Nginx del VPS
# (deploy/nginx-jamaroff.conf), así no choca con Cuadra ni con los otros sistemas.
# Uso (desde /opt/jamaroff):  docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build

name: jamaroff

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jamaroff
      POSTGRES_DB: jamaroff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./respaldos:/respaldos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jamaroff -d jamaroff"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://jamaroff:${POSTGRES_PASSWORD}@db:5432/jamaroff
      UPLOAD_DIR: /app/uploads
    # Solo escucha dentro del VPS: Nginx es la puerta de entrada
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3390}:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
