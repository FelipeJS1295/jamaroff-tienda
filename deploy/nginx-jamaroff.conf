# Nginx para la tienda Jamaroff. El instalador reemplaza el puerto y certbot agrega el HTTPS.
# jamaroff.cl redirige a www.jamaroff.cl (la dirección principal).
server {
    listen 80;
    listen [::]:80;
    server_name jamaroff.cl;
    return 301 https://www.jamaroff.cl$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.jamaroff.cl;

    # Fotos de productos subidas desde el admin
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Fotos y archivos estáticos: caché larga en el navegador
    location ~ ^/(uploads|_next/static|fonts)/ {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }
}
